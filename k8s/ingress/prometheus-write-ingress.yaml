apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-write-ingress
  namespace: observability
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: loki-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Prometheus"
spec:
  ingressClassName: nginx
  rules:
    - host: prometheus.home.coderstudio.org
      http:
        paths:
          - path: /api/v1/write
            pathType: Exact
            backend:
              service:
                name: prometheus-server
                port:
                  number: 80
